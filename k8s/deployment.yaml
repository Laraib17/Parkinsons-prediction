apiVersion: apps/v1
kind: Deployment
metadata:
  name: parkinsons-api-deployment
  labels:
    app: parkinsons-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: parkinsons-api
  template:
    metadata:
      labels:
        app: parkinsons-api
    spec:
      containers:
      - name: parkinsons-container
        image: laraib17/parkinsons-prediction-api:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
